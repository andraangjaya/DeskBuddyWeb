<body class="bg-[#FAFBFF]">
<div class="flex flex-col md:flex-row gap-6 md:gap-12 lg:gap-20">
  <div class="md:sticky md:top-0 md:h-screen md:shrink-0">
    <div class="fixed inset-0 bg-black/50 z-40 md:hidden" *ngIf="sidebarOpen" (click)="toggleSidebar()"></div>
    <div class="fixed left-0 top-0 bottom-0 w-64 max-w-[80%] bg-white z-50 transform transition-transform duration-300 md:relative md:translate-x-0 md:w-auto md:max-w-none md:block"
         [class.-translate-x-full]="!sidebarOpen" [class.translate-x-0]="sidebarOpen">
      <app-sidebar></app-sidebar>
    </div>
  </div>
  <div
    class="flex flex-col bg-[#FFFFFF] shadow-[0_10px_60px_rgba(226,236,249,0.5)] rounded-[16px] md:rounded-[30px] w-full mt-4 md:mt-10 md:mr-16 lg:mr-20 mb-8 md:mb-10 p-3 md:p-8 lg:p-10">
    <div class="flex items-center justify-between md:hidden mb-2">
      <button type="button" class="inline-flex items-center gap-2 px-3 py-2 rounded-md border border-[#E5E7EB]"
              (click)="toggleSidebar()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 7H20" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
          <path d="M4 12H20" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
          <path d="M4 17H20" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="text-sm">Menu</span>
      </button>
    </div>
    <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
      <div class="text-xl md:text-2xl font-semibold w-2xl">
        <h1>Settings</h1>
      </div>
      <div
        class="w-full md:w-[216px] h-[38px] bg-[#F9FBFF] shadow-[0_10px_60px_rgba(226,236,249,0.5)] rounded-[12px] flex items-center px-3 gap-2">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M11 19C15.4183 19 19 15.4183 19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19Z"
            stroke="#7E7E7E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M21 21L16.65 16.65" stroke="#7E7E7E" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>

        <input type="text" placeholder="Search"
               class="w-full h-full border-none outline-none text-sm text-gray-700 placeholder-gray-400 bg-transparent"/>
      </div>
    </div>
    <div class="flex flex-col sm:flex-row sm:items-center mt-4 md:mt-10 ml-0 md:ml-5 gap-4 md:gap-5">
      <div class="w-[100px] h-[100px] md:w-[137px] md:h-[137px] border border-black rounded-full overflow-hidden">
        <img src="/ppGRED.png" alt="gred">
      </div>
      <div class="grid grid-rows-3 gap-3 md:gap-5 sm:ml-10">
        <div
          class="flex flex-row justify-between sm:justify-start gap-3 sm:gap-10 bg-[#FFFFFF] shadow-[0_4px_4px_rgba(0,0,0,0.25),0_4px_4px_rgba(0,0,0,0.25),0_10px_60px_rgba(226,236,249,0.5)] rounded-[10px] md:rounded-[15px] p-3 md:p-4">
          <label class="text-lg font-semibold">Profile Name</label>
          <label class="text-[#7E7E7E] mr-5">GRED Ayam Tempong</label>
        </div>
        <div
          class="flex flex-row justify-between sm:justify-start gap-4 sm:gap-17 bg-[#FFFFFF] shadow-[0_4px_4px_rgba(0,0,0,0.25),0_4px_4px_rgba(0,0,0,0.25),0_10px_60px_rgba(226,236,249,0.5)] rounded-[10px] md:rounded-[15px] w-full sm:w-[350px] p-3 md:p-4">
          <label class="text-lg font-semibold">Authority</label>
          <label class="text-[#7E7E7E]">Teacher</label>
        </div>
        <div
          class="bg-black shadow-[0_4px_4px_rgba(0,0,0,0.25),0_4px_4px_rgba(0,0,0,0.25),0_10px_60px_rgba(226,236,249,0.5)] rounded-[10px] md:rounded-[15px] p-3 md:p-4 w-full sm:w-[220px]">
          <button type="button" class="text-white">Edit Profile Picture</button>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 mt-8 md:mt-20 gap-3 md:gap-8 lg:gap-10">
      <div
        class="flex flex-row justify-between bg-[#FFFFFF] shadow-[0_4px_4px_rgba(0,0,0,0.25),0_4px_4px_rgba(0,0,0,0.25),0_10px_60px_rgba(226,236,249,0.5)] rounded-[10px] md:rounded-[15px] p-3 md:p-4">
        <label class="text-lg font-semibold">Theme Selection</label>
        <label class="text-[#7E7E7E]">Light</label>
      </div>
      <div
        class="flex flex-row justify-between bg-[#FFFFFF] shadow-[0_4px_4px_rgba(0,0,0,0.25),0_4px_4px_rgba(0,0,0,0.25),0_10px_60px_rgba(226,236,249,0.5)] rounded-[10px] md:rounded-[15px] p-3 md:p-4">
        <label class="text-lg font-semibold">Font Size</label>
        <label class="text-[#7E7E7E]">Medium</label>
      </div>

    </div>
  </div>
</div>
</body>
